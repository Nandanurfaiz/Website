<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Status Pengiriman</title>
    <link rel="stylesheet" href="../css/styleForm.css">
</head>
<body>
    <div class="container">
        <h1>Update Status Pengiriman</h1>

        <form action="">
        <label for="IDPesanan">Cari ID Pesanan</label>
        <input type="text" id="IDPesanan" required>

        <label for="StatusPesanan">Ubah Status Pesanan</label>
        <select id="StatusPesanan" name="StatusPesanan" required>
            <option value="">Pesanan Sedang Diantar</option>
            <option value="">Pesanan Sudah Diterima</option>
        </select>

        <button type="submit">Update Status Pesanan</button>  

    </form>
    </div>
</body>
</html>
