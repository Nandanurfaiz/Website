<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Akun</title>
    <link rel="stylesheet" href="../css/styleForm.css">
</head>

<body>
    <div class="container">
        <form action="">
            <h1>Edit Akun</h1>
            <br>
            <label for="ubahUsername">Ubah Username:</label>
            <input type="text" name="ubahUsername" id="ubahUsername" placeholder="Masukkan Username Baru">

            <label for="ubahPassword">Ubah Password:</label>
            <input type="password" name="ubahUsername" id="ubahUsername" placeholder="Masukkan Password Baru">

            <label for="nomorTelepon">Ubah Nomor Telepon:</label>
            <input type="tel" id="nomorTelepon" placeholder="Masukkan Nomor Telepon Baru" required>

            <label for="ubahAlamat">Ubah Alamat:</label>
            <textarea name="ubahAlamat" id="ubahAlamat" cols="50" rows="5" placeholder=" Masukkan Alamat Baru" required></textarea>

            <button type="submit">Simpan Perubahan</button>
        </form>
    </div>
</body>
</html>
