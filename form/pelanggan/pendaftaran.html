<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../css/styleForm.css">
</head>

<body>
    <div class="container">
    <h1>Buat Akun</h1>
    <form action="../../php/simpan_pelanggan.php" method="post">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan Nama" required>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Masukkan Username" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Masukkan Email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Masukkan Password" required>

        <label for="no_hp">Nomor Telepon:</label>
        <input type="tel" id="no_hp" name="no_hp" placeholder="Masukkan Nomor Telepon" required>

        <label for="alamat">Alamat Lengkap:</label>
        <textarea name="alamat" id="alamat" name="alamat" cols="50" rows="5" placeholder=" Masukkan Alamat Lengkap" required></textarea>

        <button type="submit">Buat Akun</button>
        
        <p>Sudah punya akun? <a href="login.html">Login Disini</a></p>

    </form>
    </div>
    
</body>
</html>
