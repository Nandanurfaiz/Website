<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Status Pesanan</title>
    <link rel="stylesheet" href="../css/styleForm.css">
</head>
<body>
    <div class="container">
        <h1>Update Status Pesanan</h1>
        <form action="">
            <label for="IDPesanan">Cari ID Pesanan:</label>
            <input type="text" id="IDPesanan" required>

            <label for="statusPesanan">Ubah Status Pesanan</label>
            <select id="statusPesanan" name="statusPesanan" required>
                <option value="">Sedang Disiapkan</option>
                <option value="">Siap Untuk Diantar</option>
        </select>

        <button type="submit">Update Status Pesanan</button>
    </form>
    </div>
</body>
</html>
