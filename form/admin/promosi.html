<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promosi</title>
    <link rel="stylesheet" href="../css/styleForm.css">
</head>

<body>
    <div class="container">
        <h1>Buat Promosi</h1>
        <form action="">
            <label for="namaPromosi">Nama Promosi</label>  
            <input type="text" name="namaPromosi" id="namaPromosi" required>  

            <label for="diskon">Diskon</label>  
            <input type="number" name="diskon" id="diskon" required> 

            <label for="tanggalMulai">Tanggal Mulai</label>  
            <input type="datetime-local" name="tanggalMulai" id="tanggalMulai"> 

            <label for="tanggalBerakhir">Tanggal Berakhir</label>  
            <input type="datetime-local" name="tanggalBerakhir" id="tanggalBerakhir"> 

            <button type="submit">Buat Promosi</button>
        </form>
    </div>
</body>
</html>
